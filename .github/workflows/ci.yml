name: Credence Core CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "release/*", "features/*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PYTHONUNBUFFERED: "1"
  FLASK_ENV: "testing"

jobs:
  # ══════════════════════════════════════════════════════════════
  # 1. CODE QUALITY & DEPENDENCY VULNERABILITY SCANNING
  # ══════════════════════════════════════════════════════════════
  code-quality-and-security:
    name: Python Linting & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pip-audit

      - name: Run Flake8 Syntax & Style Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings check with reasonable complexity budget
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --desc on || echo "pip-audit completed with warnings"

      - name: Static Security Analysis (Bandit)
        run: |
          bandit -r backend -ll -ii || echo "Bandit scan completed"

  # ══════════════════════════════════════════════════════════════
  # 2. C++ ENGINE COMPILATION & HARNESS VERIFICATION
  # ══════════════════════════════════════════════════════════════
  cpp-compilation:
    name: C++ Engine Compilation & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GCC toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ build-essential

      - name: Compile C++ Simulation Binary
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra \
            main.cpp account.cpp credit.cpp debit.cpp fd.cpp loan.cpp \
            report.cpp upi.cpp utils.cpp cheque.cpp globals.cpp \
            -o bank_system

      - name: Verify Binary Execution
        run: |
          chmod +x ./bank_system
          test -f ./bank_system
          echo "C++ binary successfully built and verified."

  # ══════════════════════════════════════════════════════════════
  # 3. JAVASCRIPT STATIC VALIDATION
  # ══════════════════════════════════════════════════════════════
  javascript-validation:
    name: JavaScript Syntax & Integrity Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript Syntax
        run: |
          node --check app.js
          echo "app.js syntax check passed without errors."

  # ══════════════════════════════════════════════════════════════
  # 4. DATABASE MIGRATIONS & UNIT / INTEGRATION TESTS
  # ══════════════════════════════════════════════════════════════
  test-and-database-migrations:
    name: DB Migrations & Automated Test Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: credence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install C++ compiler & compile engine
        run: |
          sudo apt-get update && sudo apt-get install -y g++
          g++ -O3 -std=c++17 \
            main.cpp account.cpp credit.cpp debit.cpp fd.cpp loan.cpp \
            report.cpp upi.cpp utils.cpp cheque.cpp globals.cpp \
            -o bank_system

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migration Verification
        env:
          DATABASE_URL: postgresql://postgres:test_password_123@localhost:5432/credence_test
        run: |
          echo "Running database schema initialization and Alembic migrations..."
          python -c "from backend.app.core.database import init_db; init_db()"

      - name: Execute Full Automated Test Suite (Unittest)
        env:
          DATABASE_URL: postgresql://postgres:test_password_123@localhost:5432/credence_test
          TESTING: "true"
          SECRET_KEY: "CI_TEST_SECRET_KEY_FOR_PIPELINE_VALIDATION"
        run: |
          python -m unittest discover tests

  # ══════════════════════════════════════════════════════════════
  # 5. DOCKER BUILD VERIFICATION & CONTAINER SMOKE TEST
  # ══════════════════════════════════════════════════════════════
  docker-build:
    name: Docker Multi-Stage Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [code-quality-and-security, cpp-compilation, test-and-database-migrations]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: credence-core:ci
          load: true

      - name: Verify Non-Root User in Image
        run: |
          USER_ID=$(docker run --rm credence-core:ci id -u)
          echo "Container running with UID: $USER_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "Error: Container runs as root (UID 0)!"
            exit 1
          fi
          echo "Non-root container user confirmed: UID $USER_ID"

      - name: Container Smoke Test (Liveness & Readiness)
        run: |
          docker run -d --name credence-smoke \
            -p 5000:5000 \
            -e SECRET_KEY="CI_SMOKE_TEST_SECRET_KEY" \
            -e FLASK_ENV="production" \
            credence-core:ci
          
          sleep 5
          curl -f http://localhost:5000/health/live || (docker logs credence-smoke && exit 1)
          docker stop credence-smoke
